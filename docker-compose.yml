services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: microlearn
      POSTGRES_USER: microlearn
      POSTGRES_PASSWORD: microlearn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/microlearn
      SPRING_DATASOURCE_USERNAME: microlearn
      SPRING_DATASOURCE_PASSWORD: microlearn
      JWT_SECRET: change-this-in-production-minimum-256-bits-long-secret-key
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - db

volumes:
  pgdata:
