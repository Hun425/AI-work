spring:
  application:
    name: microlearn

  # Virtual Thread 활성화
  threads:
    virtual:
      enabled: true

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Modulith Events
  modulith:
    events:
      republish-outstanding-events-on-restart: true

# JWT
jwt:
  secret: ${JWT_SECRET:microlearn-dev-secret-key-change-in-production-minimum-256-bits-long}
  expiration-ms: 86400000  # 24h

# Google OAuth
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Anthropic Claude API
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-4-20250514

# Server
server:
  port: 8080

# Logging
logging:
  level:
    com.microlearn: DEBUG
    org.springframework.modulith: DEBUG

---
# Test profile
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
